name: Build exe (manual)

# The manual path: any .py (or .spec) anywhere in the repo, with the options the
# drop folder doesn't expose — icon, windowed mode, extra PyInstaller flags.
#   Actions -> Build exe (manual) -> Run workflow

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path to the .py or .spec to compile, e.g. scripts/hello.py"
        required: true
      requirements:
        description: "requirements.txt path. Blank = find it automatically. 'none' = stdlib only"
        required: false
        default: ""
      name:
        description: "Name for the .exe. Blank = same as the script filename"
        required: false
        default: ""
      mode:
        description: "onefile = one .exe. onedir = a folder (starts faster, fewer AV false positives)"
        type: choice
        options: [onefile, onedir]
        default: onefile
      console:
        description: "windowed hides the console window — only for GUI scripts"
        type: choice
        options: [console, windowed]
        default: console
      icon:
        description: "Path to a .ico file (optional)"
        required: false
        default: ""
      extra_args:
        description: 'Extra PyInstaller flags, e.g. --add-data "assets;assets" --hidden-import pkg'
        required: false
        default: ""
      smoke_args:
        description: "Run the built exe with these args and require exit 0, e.g. --version"
        required: false
        default: ""
      python_version:
        description: "Python version to build with"
        required: false
        default: "3.12"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Name this build
        id: meta
        shell: pwsh
        env:
          SCRIPT: ${{ inputs.script }}
          EXE_NAME: ${{ inputs.name }}
        run: |
          if ($env:EXE_NAME) { $name = $env:EXE_NAME }
          else {
            $stem = [IO.Path]::GetFileNameWithoutExtension($env:SCRIPT)
            $name = if ($stem -eq "main") { Split-Path -Leaf (Split-Path -Parent $env:SCRIPT) } else { $stem }
          }
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        shell: pwsh
        # Same script you'd run locally — the workflow only supplies -NoVenv so
        # it uses the runner's Python instead of building a virtualenv.
        run: |
          ./build-exe.ps1 `
            -Script "${{ inputs.script }}" `
            -Requirements "${{ inputs.requirements }}" `
            -Name "${{ inputs.name }}" `
            -Mode "${{ inputs.mode }}" `
            -Console "${{ inputs.console }}" `
            -Icon "${{ inputs.icon }}" `
            -ExtraArgs "${{ inputs.extra_args }}" `
            -SmokeArgs "${{ inputs.smoke_args }}" `
            -NoVenv

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/**
          if-no-files-found: error
          retention-days: 90
